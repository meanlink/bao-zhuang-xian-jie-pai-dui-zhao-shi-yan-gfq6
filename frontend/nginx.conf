server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    client_max_body_size 72m;
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
    }
    location / { try_files $uri $uri/ /index.html; }
}
